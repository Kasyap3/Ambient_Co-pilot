<!DOCTYPE html>
<html>

<head>
    <title>Ambient Copilot - Setup</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #1f2937;
            text-align: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 24px;
        }

        p {
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success {
            color: #059669;
            display: none;
            margin-top: 16px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎙️ Enable Voice Input</h1>
        <p>Ambient Copilot needs your permission to use the microphone for voice commands. This only needs to be done
            once.</p>
        <button id="grantBtn">Allow Microphone Access</button>
        <div id="successMsg" class="success">✅ Permission granted! You can close this tab.</div>
    </div>
    <script src="setup.js"></script>
</body>

</html>
