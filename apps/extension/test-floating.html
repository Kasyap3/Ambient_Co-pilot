<!DOCTYPE html>
<html>
<head>
    <title>Test Floating Assistant</title>
</head>
<body>
    <h1>Test Page for Floating Assistant</h1>
    <p>Open the console (F12) and check for the floating assistant script loading message.</p>
    <p>You should see: "🤖 Ambient Copilot floating assistant loaded and ready on: [URL]"</p>
    
    <button onclick="testMessage()">Test Manual Trigger</button>
    
    <script>
        function testMessage() {
            chrome.runtime.sendMessage({
                action: 'show_assistant',
                message: 'Test message from button click!',
                context: { test: true }
            }, (response) => {
                console.log('Response:', response);
            });
        }
    </script>
</body>
</html>
